<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Well Read — Book Recommendations</title>
<style>
  :root{
    --ink:#1c1c1a;
    --parchment:#f1e9d6;
    --forest:#1f3d32;
    --forest-dark:#152922;
    --gold:#c8992a;
    --brick:#8a3b32;
    --paper-line: rgba(28,28,26,0.08);
    --radius: 4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--parchment);
    background-image:
      radial-gradient(rgba(28,28,26,0.045) 0.6px, transparent 0.6px),
      radial-gradient(rgba(28,28,26,0.035) 0.6px, transparent 0.6px);
    background-size: 3px 3px, 5px 5px;
    background-position: 0 0, 1.5px 2.5px;
    color:var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:90px;
  }
  .sans{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  main{ padding:18px 20px 20px; max-width:720px; margin:0 auto; }
  .results-shell{
    background:var(--forest);
    color:var(--parchment);
    padding:18px 20px 16px;
    border-radius:0 0 12px 12px;
    box-shadow:0 5px 16px rgba(21,41,34,0.14);
  }
  .results-shell-inner{max-width:720px;margin:0 auto;}
  .results-kicker{
    margin:0 0 4px;
    font:600 11px/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    text-transform:uppercase;
    letter-spacing:.16em;
    color:var(--gold);
  }
  .results-title{margin:0;font-size:28px;font-weight:400;line-height:1.15;}
  .results-subtitle{margin:7px 0 0;font:13px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:rgba(241,233,214,.72);}
  #results{margin-top:14px;}
  .panel{
    background:#fbf7ec;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 1px 0 rgba(28,28,26,0.03);
  }
  .panel h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--forest);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel h2::before{content:"";width:14px;height:1px;background:var(--gold);display:inline-block;}
  textarea{
    width:100%;min-height:78px;resize:vertical;border:1px solid var(--paper-line);border-radius:var(--radius);
    background:#fff;padding:12px;font-family:Georgia,serif;font-size:15px;color:var(--ink);
  }
  textarea:focus, button:focus-visible, .chip:focus-visible{
    outline:2px solid var(--brick);outline-offset:2px;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;padding:9px 14px;min-height:38px;
    border-radius:20px;border:1px solid var(--forest);background:transparent;color:var(--forest);cursor:pointer;
    transition:background 0.15s, color 0.15s;-webkit-tap-highlight-color:transparent;
  }
  .chip.active{background:var(--forest);color:var(--parchment);}
  .cta-bar{
    position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top, var(--parchment) 60%, rgba(241,233,214,0));
    padding:18px 20px 20px;display:flex;justify-content:center;z-index:10;
  }
  #findBtn{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--brick);color:#fff;border:none;border-radius:30px;
    padding:15px 34px;font-size:15px;font-weight:600;letter-spacing:0.02em;cursor:pointer;box-shadow:0 6px 18px rgba(138,59,50,0.35);
    max-width:400px;width:100%;
  }
  #findBtn:active{ transform:translateY(1px); }
  #findBtn:disabled{ opacity:0.6; cursor:default; }
  .status{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:var(--forest);padding:14px 0;}
  .librarian-note{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;color:var(--forest);
    background:rgba(200,153,42,0.12);border-left:2px solid var(--gold);padding:10px 12px;margin:0 0 14px;line-height:1.5;
  }
  .book-card{
    display:grid;grid-template-columns:92px 1fr;gap:0;background:#fbf7ec;border:1px solid var(--paper-line);
    border-radius:var(--radius);overflow:hidden;margin-bottom:14px;animation:riseIn .35s ease both;box-shadow:0 1px 0 rgba(28,28,26,0.04);
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .book-cover-wrap{background:rgba(31,61,50,.06);min-height:138px;display:flex;align-items:stretch;justify-content:center;overflow:hidden;}
  .book-cover{width:100%;height:100%;object-fit:cover;display:block;}
  .book-cover-fallback{width:100%;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;font:600 10px/1.35 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--forest);}
  .book-body{padding:14px 15px;min-width:0;}
  .book-title{font-size:18px;margin:0 0 3px;line-height:1.25;}
  .book-author{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:11.5px;color:var(--brick);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px;}
  .book-meta{font:11.5px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#69675f;margin:0 0 8px;}
  .book-why{font-size:14px;line-height:1.48;margin:0 0 9px;color:#3a3a36;}
  .book-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:10.5px;color:var(--forest);border:1px solid var(--paper-line);background:rgba(31,61,50,.06);padding:3px 8px;border-radius:10px;}
  .empty-note{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13.5px;color:#6b6a63;text-align:center;padding:26px 10px;}
  .catalog-note{font:11.5px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#77736a;margin:-2px 0 16px;text-align:center;}
  @media(max-width:520px){.book-card{grid-template-columns:78px 1fr}.results-title{font-size:25px}}
</style>
</head>
<body>
<section class="results-shell">
  <div class="results-shell-inner">
    <p class="results-kicker">Well Read</p>
    <h1 class="results-title">Your results</h1>
    <p class="results-subtitle">Recommendations from the catalog will appear here after you tell me what you want to read.</p>
  </div>
</section>
<main>
  <div id="results"><p class="empty-note">Choose a genre, mood, or describe what you're looking for below.</p></div>
  <div class="panel">
    <h2>Tell me a bit about yourself</h2>
    <textarea id="tasteInput" placeholder="e.g. I loved Circe and The Night Circus, want something atmospheric with a slow burn romance..."></textarea>
  </div>
  <div class="panel">
    <h2>Pick a shelf or two</h2>
    <div class="chip-row" id="genreChips">
      <button class="chip" data-val="Literary Fiction">Literary Fiction</button>
      <button class="chip" data-val="Fantasy">Fantasy</button>
      <button class="chip" data-val="Sci-Fi">Sci-Fi</button>
      <button class="chip" data-val="Mystery/Thriller">Mystery/Thriller</button>
      <button class="chip" data-val="Romance">Romance</button>
      <button class="chip" data-val="Historical Fiction">Historical Fiction</button>
      <button class="chip" data-val="Horror">Horror</button>
      <button class="chip" data-val="Nonfiction">Nonfiction</button>
      <button class="chip" data-val="Poetry">Poetry</button>
      <button class="chip" data-val="Classics">Classics</button>
    </div>
  </div>
  <div class="panel">
    <h2>What kind of feeling are you after</h2>
    <div class="chip-row" id="moodChips">
      <button class="chip" data-val="cozy">Cozy</button>
      <button class="chip" data-val="dark tense">Dark &amp; tense</button>
      <button class="chip" data-val="adventurous">Adventurous</button>
      <button class="chip" data-val="thought provoking">Thought-provoking</button>
      <button class="chip" data-val="heartwarming">Heartwarming</button>
      <button class="chip" data-val="funny">Funny</button>
    </div>
  </div>
  <p class="catalog-note" id="catalogNote">Loading book catalog…</p>
</main>
<div class="cta-bar"><button id="findBtn" class="sans">Find my books</button></div>
<script src="books-data.js"></script>
<script>
  const findBtn=document.getElementById('findBtn');
  const resultsEl=document.getElementById('results');
  const catalogNote=document.getElementById('catalogNote');
  const books=Array.isArray(window.BOOK_DATA)?window.BOOK_DATA:[];
  catalogNote.textContent=books.length?`${books.length.toLocaleString()} books loaded from your catalog.`:'Book catalog could not be loaded.';

  function setupChips(id){document.querySelectorAll('#'+id+' .chip').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('active')))}
  setupChips('genreChips');setupChips('moodChips');
  function vals(id){return Array.from(document.querySelectorAll('#'+id+' .chip.active')).map(c=>c.dataset.val)}
  const stop=new Set('a an and are as at be been but by for from had has have he her hers him his i if in into is it its me my of on or our she so that the their them there they this to was we were what when where which who with you your'.split(' '));
  function terms(s){return (s||'').toLowerCase().replace(/[^a-z0-9\s'-]/g,' ').split(/\s+/).filter(w=>w.length>2&&!stop.has(w))}
  function text(b){return `${b.title||''} ${b.authors||''} ${b.categories||''} ${b.description||''}`.toLowerCase()}
  const genreMap={
    'literary fiction':['fiction','literary','novel'],fantasy:['fantasy','magic','myth','fairy','dragon'],
    'sci-fi':['science fiction','sci fi','space','dystopia','cyberpunk'],
    'mystery/thriller':['mystery','detective','thriller','crime','suspense','murder'],romance:['romance','love','relationship'],
    'historical fiction':['historical','history','war','century'],horror:['horror','ghost','supernatural','vampire'],
    nonfiction:['biography','autobiography','history','science','philosophy','psychology','business','religion','health','travel','politics'],
    poetry:['poetry','poems','poet'],classics:['classic','classics','19th century','18th century']
  };
  const moodMap={
    cozy:['cozy','gentle','small town','comfort','friendship'],
    'dark tense':['dark','murder','death','crime','war','violent','danger','revenge','thriller','suspense'],
    adventurous:['adventure','quest','journey','travel','expedition','battle'],
    'thought provoking':['philosophy','society','identity','morality','political','psychology','meaning','ethics'],
    heartwarming:['family','friendship','love','hope','healing'],funny:['humor','humour','comic','funny','satire','comedy']
  };
  function scoreBook(b,taste,genres,moods){
    const hay=text(b);let score=0;
    const q=terms(taste);q.forEach(w=>{if((b.title||'').toLowerCase().includes(w))score+=7;else if((b.authors||'').toLowerCase().includes(w))score+=6;else if((b.categories||'').toLowerCase().includes(w))score+=4;else if(hay.includes(w))score+=2});
    genres.forEach(g=>(genreMap[g.toLowerCase()]||[g.toLowerCase()]).forEach(k=>{if(hay.includes(k))score+=5}));
    moods.forEach(m=>(moodMap[m.toLowerCase()]||[m.toLowerCase()]).forEach(k=>{if(hay.includes(k))score+=3}));
    const r=Number(b.average_rating)||0,c=Number(b.ratings_count)||0;
    if(r>=4.5)score+=4;else if(r>=4.2)score+=3;else if(r>=4)score+=2;else if(r>=3.7)score+=1;
    score+=Math.min(4,Math.log10(c+1)*.75);
    if(!b.description)score-=1;
    return score;
  }
  function candidates(taste,genres,moods){
    return books.map(b=>({b,s:scoreBook(b,taste,genres,moods)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,18).map(x=>x.b);
  }
  function whyLocal(b,taste,genres,moods){
    const bits=[];
    if(genres.length)bits.push(`It lines up with your ${genres.slice(0,2).join(' / ')} preference`);
    if(moods.length)bits.push(`and leans ${moods.slice(0,2).join(' and ')}`);
    if(taste)bits.push('while matching several ideas from what you described');
    const r=Number(b.average_rating)||0;if(r>=4)bits.push(`It also carries a strong ${r.toFixed(2)} reader rating`);
    return (bits.join(' ')+'.').replace(/^and /,'');
  }
  function meta(b){const x=[];if(b.published_year)x.push(b.published_year);if(b.num_pages)x.push(`${b.num_pages} pages`);if(Number(b.average_rating)>0)x.push(`★ ${Number(b.average_rating).toFixed(2)}`);return x.join(' · ')}
  function render(list,note){
    if(!list.length){resultsEl.innerHTML='<p class="empty-note">I couldn\'t find a strong match in the catalog. Try another genre, mood, author, or a few descriptive words.</p>';return}
    resultsEl.innerHTML=(note?`<p class="librarian-note">${esc(note)}</p>`:'')+list.map((b,i)=>`
      <article class="book-card" style="animation-delay:${i*.05}s">
        <div class="book-cover-wrap">${b.thumbnail?`<img class="book-cover" src="${esc(b.thumbnail.replace(/^http:/,'https:'))}" alt="Cover of ${esc(b.title||'book')}" onerror="this.parentNode.innerHTML='<div class=&quot;book-cover-fallback&quot;>No cover available</div>'">`:'<div class="book-cover-fallback">No cover available</div>'}</div>
        <div class="book-body">
          <p class="book-title">${esc(b.title||'Untitled')}</p>
          <p class="book-author sans">${esc(b.authors||'Unknown author')}</p>
          ${meta(b)?`<p class="book-meta">${esc(meta(b))}</p>`:''}
          <p class="book-why">${esc(b.why||'')}</p>
          <div class="book-tags">${(b.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
        </div>
      </article>`).join('');
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function localResult(pool,taste,genres,moods){
    return pool.slice(0,6).map(b=>({...b,why:whyLocal(b,taste,genres,moods),tags:[b.categories,genres[0],moods[0]].filter(Boolean).slice(0,3)}));
  }
  findBtn.addEventListener('click',async()=>{
    const taste=document.getElementById('tasteInput').value.trim(),genres=vals('genreChips'),moods=vals('moodChips');
    if(!taste&&!genres.length&&!moods.length){resultsEl.innerHTML='<p class="empty-note">Give me a favorite book, genre, or mood first and I\'ll build a better set.</p>';window.scrollTo({top:0,behavior:'smooth'});return}
    if(!books.length){resultsEl.innerHTML='<p class="empty-note">The book dataset is missing. Keep <strong>books-data.js</strong> in the same folder as this HTML file.</p>';return}
    const pool=candidates(taste,genres,moods);
    findBtn.disabled=true;findBtn.textContent='Finding matches…';resultsEl.innerHTML='<p class="status">Searching your catalog for the strongest matches…</p>';
    const local=localResult(pool,taste,genres,moods);
    try{
      const compact=pool.map((b,i)=>({id:i,title:b.title,author:b.authors,category:b.categories,description:(b.description||'').slice(0,500),rating:b.average_rating,pages:b.num_pages,year:b.published_year}));
      const prompt=`You are a warm, well-read librarian. Select exactly 6 books ONLY from the supplied catalog candidates. Never introduce a title that is not in the candidate list. Reader preference: ${taste||'(none)'}. Genres: ${genres.join(', ')||'(none)'}. Mood: ${moods.join(', ')||'(none)'}. Candidates: ${JSON.stringify(compact)}. Return ONLY JSON: {"note":"one short conversational sentence","books":[{"id":0,"why":"specific conversational reason","tags":["2-4 short tags"]}]}. Use candidate id values exactly.`;
      const response=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:900,messages:[{role:'user',content:prompt}]})});
      if(!response.ok)throw new Error('AI request unavailable');
      const data=await response.json(),block=(data.content||[]).find(x=>x.type==='text');
      let raw=(block?.text||'{}').trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim(),parsed;
      try{parsed=JSON.parse(raw)}catch{const m=raw.match(/\{[\s\S]*\}/);parsed=m?JSON.parse(m[0]):{}}
      const selected=(parsed.books||[]).map(x=>{const base=pool[Number(x.id)];return base?{...base,why:x.why||whyLocal(base,taste,genres,moods),tags:Array.isArray(x.tags)?x.tags:[]}:null}).filter(Boolean);
      render(selected.length?selected:local,parsed.note||'These are the strongest matches I found in your catalog.');
    }catch(e){
      render(local,'I matched these directly from your uploaded catalog using your preferences, ratings, descriptions, and categories.');
    }finally{findBtn.disabled=false;findBtn.textContent='Find my books'}
  });
  function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
</script>
</body>
</html>
